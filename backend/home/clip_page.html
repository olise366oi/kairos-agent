<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中转站</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1a1a;color:#eee;font-family:-apple-system,sans-serif;}
#top{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;}
#top a{color:#4a90d9;text-decoration:none;font-size:16px;}
#wrap{padding:16px;height:calc(100% - 60px);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;}
#ta{flex:1;width:100%;box-sizing:border-box;padding:12px;border:1px solid #333;border-radius:8px;background:#222;color:#eee;font-size:16px;resize:none;font-family:inherit;}
#imgbox{display:none;text-align:center;}
#imgbox img{max-width:100%;max-height:60vh;border-radius:8px;}
#btns{display:flex;gap:8px;}
#btns button{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;background:#4a90d9;color:#fff;cursor:pointer;}
#btns button.clear{background:#e74c3c;}
</style>
</head>
<body>
<div id="top">
  <a href="/home?t=TOKEN">← 返回</a>
  <span>中转站</span>
  <span style="width:60px"></span>
</div>
<div id="wrap">
  <textarea id="ta" placeholder="粘贴内容…"></textarea>
  <div id="imgbox"><img id="img"></div>
  <div id="btns">
    <button onclick="clearAll()" class="clear">清空</button>
  </div>
</div>
<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const TA = document.getElementById('ta');
const IMGBOX = document.getElementById('imgbox');
const IMG = document.getElementById('img');

async function loadClip(){
  const r = await fetch('/api/clip/get?t=' + TOKEN).then(r=>r.json());
  if (r.type === 'image') {
    TA.style.display = 'none';
    IMGBOX.style.display = 'block';
    IMG.src = '/api/clip/image?t=' + TOKEN + '&_=' + Date.now();
  } else {
    TA.style.display = 'block';
    IMGBOX.style.display = 'none';
    if (TA.value !== r.content) TA.value = r.content;
  }
}

let saveTimer = null;
TA.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await fetch('/api/clip/set?t=' + TOKEN, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type:'text', content:TA.value})
    });
  }, 500);
});

document.addEventListener('paste', async (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = async (ev) => {
        await fetch('/api/clip/set?t=' + TOKEN, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({type:'image', content:ev.target.result})
        });
        loadClip();
      };
      reader.readAsDataURL(blob);
      return;
    }
  }
});

async function clearAll(){
  if (!confirm('清空？')) return;
  await fetch('/api/clip/clear?t=' + TOKEN, {method:'POST'});
  TA.value = '';
  loadClip();
}

loadClip();
setInterval(loadClip, 5000);
</script>
</body>
</html>
